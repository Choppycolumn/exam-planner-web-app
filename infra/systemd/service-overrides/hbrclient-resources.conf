[Service]
# The vendor job scans the whole root filesystem every night. Keep remote
# backups enabled, but prevent a scan from starving the web application.
Nice=15
IOSchedulingClass=idle
CPUAccounting=true
CPUWeight=10
CPUQuota=50%
IOAccounting=true
IOWeight=10
IOReadBandwidthMax=/dev/vda 3M
IOWriteBandwidthMax=/dev/vda 2M
IOReadIOPSMax=/dev/vda 80
IOWriteIOPSMax=/dev/vda 80
MemoryAccounting=true
MemoryHigh=128M
MemoryMax=192M
OOMPolicy=continue
TasksMax=128
