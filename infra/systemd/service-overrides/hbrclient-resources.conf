[Service]
# The vendor job scans the whole root filesystem every night. Keep remote
# backups enabled, but prevent a scan from starving the web application.
Nice=15
IOSchedulingClass=idle
CPUAccounting=true
CPUWeight=10
CPUQuota=35%
IOAccounting=true
IOWeight=10
IOReadBandwidthMax=/dev/vda 2M
IOWriteBandwidthMax=/dev/vda 1M
IOReadIOPSMax=/dev/vda 40
IOWriteIOPSMax=/dev/vda 40
MemoryAccounting=true
MemoryHigh=128M
MemoryMax=160M
OOMPolicy=continue
TasksMax=128
TimeoutStopSec=60s
