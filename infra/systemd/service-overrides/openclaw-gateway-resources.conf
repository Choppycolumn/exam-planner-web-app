[Service]
# OpenClaw normally peaks near 350 MiB on this 1 GiB host. Bound abnormal
# growth so a notification process cannot make the website unreachable.
MemoryAccounting=true
MemoryHigh=320M
MemoryMax=400M
TasksMax=128
CPUAccounting=true
CPUWeight=200
CPUQuota=100%
IOAccounting=true
IOWeight=100
Nice=5
OOMPolicy=stop
