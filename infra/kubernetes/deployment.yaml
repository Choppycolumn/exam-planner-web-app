apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-planner
  template:
    metadata:
      labels:
        app: exam-planner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: exam-planner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: exam-planner-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /opt/exam-planner/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: exam-planner-data
