<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>只读座位提醒配对</title>
  <style>
    :root { color-scheme: light; font: 14px system-ui, sans-serif; }
    body { width: 360px; margin: 0; padding: 16px; color: #172033; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { line-height: 1.5; color: #526078; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 6px; color: white; background: #2563eb; font-weight: 700; cursor: pointer; }
    button.secondary { color: #1d4ed8; border: 1px solid #93c5fd; background: white; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    #status { min-height: 22px; margin-top: 12px; color: #475569; }
    #status.error { color: #be123c; }
    #cookies { margin: 8px 0 0; padding-left: 20px; max-height: 120px; overflow: auto; color: #334155; }
    .notice { padding: 8px; border: 1px solid #bfdbfe; border-radius: 6px; background: #eff6ff; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <h1>ExamPlanner 只读座位提醒配对</h1>
  <p class="notice">请先在 Chrome 中正常登录图书馆并完成人工验证码，再主动点击配对。扩展只读取目标域 Cookie 的名称和属性用于第一步预览；Cookie 值不会显示，第二步确认后才通过 HTTPS 发送给 ExamPlanner。</p>
  <label for="origin">ExamPlanner origin</label>
  <input id="origin" type="url" placeholder="https://8.130.68.9" autocomplete="off">
  <label for="resourceUrl">当前图书馆页面 URL</label>
  <input id="resourceUrl" type="url" value="https://libresource.hust.edu.cn/" autocomplete="off">
  <label for="pairingId">配对 ID</label>
  <input id="pairingId" inputmode="numeric" autocomplete="off">
  <label for="code">一次性配对码</label>
  <input id="code" type="password" autocomplete="off">
  <button id="inspect" class="secondary" type="button">第一步：检查 Cookie 清单</button>
  <div id="status" role="status" aria-live="polite"></div>
  <ul id="cookies" aria-label="将传送的 Cookie"></ul>
  <button id="confirm" type="button" disabled>第二步：确认并配对</button>
  <script src="popup.js"></script>
</body>
</html>
