name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: cd desktop-break-guard && python -m unittest discover -s tests -v
      - run: npm run build
      - run: node --check server/auth-static-server.mjs
      - run: node --check server/web.mjs && node --check server/worker.mjs
