name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:domain-deps
      - run: npm run check:semantic-colors
      - run: npm run lint
      - run: npm test
      - run: cd desktop-break-guard && python -m unittest discover -s tests -v
      - run: npm run build
      - run: npm run check:bundle
      - run: bash -n scripts/check-system-pressure.sh scripts/hbr-window-control.sh scripts/remote-deploy.sh scripts/rollback-release.sh
      - run: node --check server/auth-static-server.mjs
      - run: node --check server/web.mjs && node --check server/worker.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            dist/build-meta.json
            playwright-report
            test-results
          if-no-files-found: ignore
